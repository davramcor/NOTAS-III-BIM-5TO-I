<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de notas - 5.º I</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f9;
    color:#1f2937;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 15px;
}

.contenedor{
    width:100%;
    max-width:720px;
}

.cabecera{
    background:#17365d;
    color:white;
    border-radius:16px 16px 0 0;
    padding:28px 24px;
    text-align:center;
}

.cabecera h1{
    margin:0 0 7px;
    font-size:27px;
}

.cabecera p{
    margin:0;
    opacity:.9;
    font-size:15px;
}

.tarjeta{
    background:white;
    border-radius:0 0 16px 16px;
    box-shadow:0 5px 22px rgba(0,0,0,.10);
    padding:24px;
}

.busqueda{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.busqueda input{
    flex:1;
    padding:14px 15px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:17px;
    outline:none;
}

.busqueda input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

button{
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    padding:0 22px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.mensaje{
    text-align:center;
    padding:15px;
    border-radius:10px;
    background:#f8fafc;
    color:#64748b;
    margin-bottom:18px;
}

.error{
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
}

.resultado{
    display:none;
}

.alumno{
    border-bottom:1px solid #e5e7eb;
    padding-bottom:17px;
    margin-bottom:17px;
}

.nombre{
    font-size:21px;
    font-weight:bold;
    color:#17365d;
    margin-bottom:5px;
}

.identificador{
    font-size:14px;
    color:#64748b;
}

.tabla{
    width:100%;
    border-collapse:collapse;
}

.tabla th{
    background:#eef2f7;
    text-align:left;
    padding:11px 10px;
    font-size:14px;
}

.tabla td{
    padding:11px 10px;
    border-bottom:1px solid #e5e7eb;
}

.nota{
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.AD{
    color:#166534;
}

.A{
    color:#2563eb;
}

.B{
    color:#b45309;
}

.C{
    color:#dc2626;
}

.pie{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
    font-size:12px;
}

@media(max-width:560px){

    .busqueda{
        flex-direction:column;
    }

    .busqueda button{
        height:48px;
    }

    .cabecera h1{
        font-size:23px;
    }

    .tarjeta{
        padding:18px;
    }

    .tabla th,
    .tabla td{
        padding:9px 7px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="cabecera">
        <h1>Consulta de notas</h1>
        <p>5.º de Secundaria – Sección I</p>
    </div>

    <div class="tarjeta">

        <div class="busqueda">

            <input
                id="identificador"
                type="text"
                inputmode="numeric"
                maxlength="14"
                placeholder="Ingrese su DNI o código"
                autocomplete="off"
            >

            <button id="buscar">
                Consultar
            </button>

        </div>

        <div id="mensaje" class="mensaje">
            Cargando información...
        </div>

        <div id="resultado" class="resultado"></div>

        <div class="pie">
            Ingrese su DNI o código de estudiante.
        </div>

    </div>

</div>


<script>

/* =========================================
   ARCHIVO CSV
   ========================================= */

const ARCHIVO = "5TO I.csv";

let estudiantes = [];


/* =========================================
   LEER UNA LÍNEA DEL CSV
   ========================================= */

function separar(linea){

    return linea
        .split(";")
        .map(x => x.trim());

}


/* =========================================
   CARGAR LOS DATOS
   ========================================= */

function cargarCSV(texto){

    texto = texto
        .replace(/^\uFEFF/, "")
        .replace(/\r/g, "");


    const lineas = texto
        .split("\n")
        .filter(linea => linea.trim() !== "");


    if(lineas.length < 2){

        throw new Error(
            "El CSV no contiene estudiantes."
        );

    }


    /*
       IMPORTANTE:

       NO dependemos de los nombres de
       las columnas.

       Usamos directamente la posición:

       0 = identificador
       1 = nombre
       2 = laboratorio 1
       3 = laboratorio 2
       4 = práctica 1
       5 = práctica 2
       6 = práctica 3
       7 = práctica 4
       8 = exposición
    */


    estudiantes = [];


    for(let i = 1; i < lineas.length; i++){

        const datos = separar(lineas[i]);


        if(datos.length < 9){
            continue;
        }


        estudiantes.push({

            identificador: datos[0],

            nombre: datos[1],

            laboratorio1: datos[2],

            laboratorio2: datos[3],

            practica1: datos[4],

            practica2: datos[5],

            practica3: datos[6],

            practica4: datos[7],

            exposicion: datos[8]

        });

    }


    if(estudiantes.length === 0){

        throw new Error(
            "No se encontraron estudiantes."
        );

    }


    document.getElementById("mensaje").className =
        "mensaje";


    document.getElementById("mensaje").textContent =
        "Información cargada. Ingrese su DNI o código.";

}


/* =========================================
   CARGAR ARCHIVO DESDE GITHUB
   ========================================= */

async function iniciar(){

    try{

        const respuesta = await fetch(
            ARCHIVO + "?v=" + Date.now()
        );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo encontrar el archivo."
            );

        }


        const buffer =
            await respuesta.arrayBuffer();


        /*
           Primero intentamos UTF-8.
        */

        let texto =
            new TextDecoder("utf-8")
            .decode(buffer);


        /*
           Si el archivo tiene caracteres
           dañados, intentamos Windows-1252.
        */

        if(texto.includes("�")){

            texto =
                new TextDecoder("windows-1252")
                .decode(buffer);

        }


        cargarCSV(texto);


    }catch(error){

        const mensaje =
            document.getElementById("mensaje");


        mensaje.className =
            "mensaje error";


        mensaje.textContent =
            'No se pudo cargar "5TO I.csv". ' +
            'Verifique que esté en el mismo repositorio ' +
            'y tenga exactamente ese nombre.';

    }

}


/* =========================================
   BUSCAR
   ========================================= */

function consultar(){

    const campo =
        document.getElementById("identificador");


    /*
       Solamente eliminamos espacios y
       caracteres que no sean números.

       LOS CEROS INICIALES SE CONSERVAN.
    */

    const buscado =
        campo.value.replace(/\D/g, "");


    const mensaje =
        document.getElementById("mensaje");


    const resultado =
        document.getElementById("resultado");


    resultado.style.display = "none";

    resultado.innerHTML = "";


    /* Debe ser DNI de 8 o código de 14 */

    if(
        buscado.length !== 8 &&
        buscado.length !== 14
    ){

        mensaje.className =
            "mensaje error";

        mensaje.style.display =
            "block";

        mensaje.textContent =
            "Ingrese un DNI de 8 dígitos o un código de 14 dígitos.";

        return;

    }


    /*
       BÚSQUEDA EXACTA.

       Ejemplo:

       CSV:
       00000073159222

       Entrada:
       00000073159222

       Coincide.

       NO quitamos los ceros.
    */

    const alumno =
        estudiantes.find(estudiante => {

            return estudiante.identificador === buscado;

        });


    /* No encontrado */

    if(!alumno){

        mensaje.className =
            "mensaje error";

        mensaje.style.display =
            "block";

        mensaje.textContent =
            "No se encontró un estudiante con ese DNI o código.";

        return;

    }


    mensaje.style.display =
        "none";


    /* =====================================
       CONSTRUIR TABLA
       ===================================== */

    const actividades = [

        [
            "Informe de laboratorio 1",
            alumno.laboratorio1
        ],

        [
            "Informe de laboratorio 2",
            alumno.laboratorio2
        ],

        [
            "Práctica 1",
            alumno.practica1
        ],

        [
            "Práctica 2",
            alumno.practica2
        ],

        [
            "Práctica 3",
            alumno.practica3
        ],

        [
            "Práctica 4",
            alumno.practica4
        ],

        [
            "Exposición",
            alumno.exposicion
        ]

    ];


    let filas = "";


    actividades.forEach(actividad => {

        const nombre =
            actividad[0];

        const nota =
            String(actividad[1] || "")
            .trim()
            .toUpperCase();


        let clase = "";

        if(
            nota === "AD" ||
            nota === "A" ||
            nota === "B" ||
            nota === "C"
        ){

            clase = nota;

        }


        filas += `

            <tr>

                <td>${nombre}</td>

                <td class="nota ${clase}">
                    ${nota || "—"}
                </td>

            </tr>

        `;

    });


    /* =====================================
       MOSTRAR RESULTADO
       ===================================== */

    resultado.innerHTML = `

        <div class="alumno">

            <div class="nombre">
                ${escapar(alumno.nombre)}
            </div>

            <div class="identificador">
                DNI / Código:
                ${escapar(alumno.identificador)}
            </div>

        </div>


        <table class="tabla">

            <thead>

                <tr>

                    <th>
                        Actividad
                    </th>

                    <th style="text-align:center">
                        Calificación
                    </th>

                </tr>

            </thead>

            <tbody>

                ${filas}

            </tbody>

        </table>

    `;


    resultado.style.display =
        "block";

}


/* =========================================
   SEGURIDAD
   ========================================= */

function escapar(texto){

    return String(texto ?? "")
        .replace(/[&<>'"]/g, caracter => {

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            }[caracter];

        });

}


/* =========================================
   BOTÓN
   ========================================= */

document
    .getElementById("buscar")
    .addEventListener(
        "click",
        consultar
    );


/* =========================================
   ENTER
   ========================================= */

document
    .getElementById("identificador")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                consultar();

            }

        }
    );


/* =========================================
   INICIAR
   ========================================= */

iniciar();

</script>

</body>
</html>
